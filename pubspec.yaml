name: flutter_pos_background_upload_download
description: QuickDrop, a resilient POS file transfer client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  file_picker: ^8.3.7
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  media_store_plus: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/quickdrop.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/quickdrop.png
